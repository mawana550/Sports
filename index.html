<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live Sports</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root { --bg:#05070c; --panel:#121827; --line:#222b3f; --text:#f2f5fb; --muted:#8b95ab; --live:#e5484d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px); }
  header { padding:18px 14px 6px; font-size:1.5rem; font-weight:700; }

  .league { padding:0 14px; }
  .league-head { display:flex; align-items:center; gap:10px; margin:24px 0 10px; }
  .league-head h2 { margin:0; font-size:1.05rem; font-weight:700; }

  /* logo / badge: image with a lettered circle as fallback */
  .logo { width:28px; height:28px; border-radius:50%; flex:none; object-fit:contain; background:#1b2338; }
  .logo.lg { width:46px; height:46px; }
  .fallback { display:grid; place-items:center; width:28px; height:28px; border-radius:50%; flex:none;
    background:#26304a; color:#cfd6e6; font-weight:700; font-size:.8rem; }
  .fallback.lg { width:46px; height:46px; font-size:1.1rem; }

  .card { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px;
    padding:14px 10px; margin-bottom:10px; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; color:inherit; text-decoration:none; }
  .team { display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center;
    font-weight:600; font-size:.95rem; line-height:1.2; min-width:0; overflow-wrap:anywhere; }
  .mid { display:flex; flex-direction:column; align-items:center; gap:4px; min-width:84px; }
  .vs { color:var(--muted); font-weight:700; font-size:.95rem; }
  .when { color:var(--muted); font-size:.85rem; text-align:center; }
  .live { background:var(--live); color:#fff; font-size:.75rem; font-weight:700; padding:3px 8px; border-radius:6px; }
  .empty { padding:20px 14px; color:var(--muted); }
</style>
</head>
<body>
<header>Matches</header>
<div id="app"></div>

<script>
/* ===== SETTINGS ===== */
const MATCH_PAGE = "match.html";   // your old page, opened as match.html?id=3

// Replace with your real data. Logo fields are image links; leave "" and a letter circle shows instead.
const matches = [
  { id:1, league:"Village League", league_logo:"", home:"Rock Rangers", home_logo:"", away:"Valley Stars",   away_logo:"", start:"2026-11-22T23:06", live:false },
  { id:2, league:"Village League", league_logo:"", home:"Hill United",  home_logo:"", away:"River Town",     away_logo:"", start:"2026-11-21T20:00", live:true  },
  { id:3, league:"County Cup",     league_logo:"", home:"Oak City",     home_logo:"", away:"Pine FC",        away_logo:"", start:"2026-11-21T21:30", live:false },
  { id:4, league:"County Cup",     league_logo:"", home:"Lake Rovers",  home_logo:"", away:"Stone Athletic", away_logo:"", start:"2026-11-28T18:00", live:false }
];
// To load from your server instead:
// fetch('/api/matches').then(r => r.json()).then(render);

/* ===== helpers ===== */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Logo image, or a lettered circle if there is no link or the image fails to load
function logo(url, name, big) {
  const size = big ? ' lg' : '';
  const letter = esc((name || '?').trim().charAt(0).toUpperCase());
  const fb = `<span class="fallback${size}">${letter}</span>`;
  if (!url) return fb;
  return `<img class="logo${size}" src="${esc(url)}" alt="" loading="lazy"
    onerror="this.outerHTML='${fb.replace(/'/g, "&#39;")}'">`;
}

// "Today 21:30", "Tomorrow 23:06", "Sunday 15:00" - never a year
function whenLabel(iso) {
  const d = new Date(iso), now = new Date();
  const sod = x => new Date(x.getFullYear(), x.getMonth(), x.getDate());
  const days = Math.round((sod(d) - sod(now)) / 86400000);
  const time = d.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', hour12:false });
  let day;
  if (days === 0) day = "Today";
  else if (days === 1) day = "Tomorrow";
  else if (days === -1) day = "Yesterday";
  else if (days > 1 && days < 7) day = d.toLocaleDateString('en-US', { weekday:'long' });
  else day = d.toLocaleDateString('en-US', { weekday:'short', day:'numeric', month:'short' });
  return `${day} ${time}`;
}

function render(list) {
  const app = document.getElementById('app');
  if (!list.length) { app.innerHTML = '<div class="empty">No matches right now.</div>'; return; }
  const groups = {};
  list.slice().sort((a, b) => new Date(a.start) - new Date(b.start))
      .forEach(m => (groups[m.league] = groups[m.league] || []).push(m));

  app.innerHTML = Object.values(groups).map(ms => `
    <section class="league">
      <div class="league-head">${logo(ms[0].league_logo, ms[0].league)}<h2>${esc(ms[0].league)}</h2></div>
      ${ms.map(m => `
        <a class="card" href="${MATCH_PAGE}?id=${encodeURIComponent(m.id)}">
          <div class="team">${logo(m.home_logo, m.home, true)}<span>${esc(m.home)}</span></div>
          <div class="mid">
            <span class="vs">vs</span>
            ${m.live ? '<span class="live">LIVE</span>' : `<span class="when">${esc(whenLabel(m.start))}</span>`}
          </div>
          <div class="team">${logo(m.away_logo, m.away, true)}<span>${esc(m.away)}</span></div>
        </a>`).join('')}
    </section>`).join('');
}
render(matches);
</script>
</body>
</html>
