<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rock Videos</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/common.css">
<style>
  header { padding:calc(env(safe-area-inset-top,0px) + 18px) 14px 4px; }
  .brand { font-size:2rem; line-height:1.1; }
  .sub { margin-top:4px; font-size:1.1rem; font-weight:600; color:var(--muted); }
</style>
</head>
<body>
<header><div class="brand" id="brand">Rock Videos</div><div class="sub">Matches</div></header>
<div id="app"><div class="empty">Loading…</div></div>

<script src="/common.js"></script>
<script>
let S = null, shownRev = -1, shownMinute = -1;
function draw() {
  $('brand').textContent = S.siteName || 'Rock Videos';
  document.title = S.siteName || 'Rock Videos';
  const list = visibleMatches(S);
  $('app').innerHTML = list.length ? leagueCards(list) : '<div class="empty">No matches right now.</div>';
}
async function refresh() {
  try {
    S = await getState();
    const minute = Math.floor(Date.now() / 60000);
    if (S.rev !== shownRev || minute !== shownMinute) { shownRev = S.rev; shownMinute = minute; draw(); }
  } catch { if (!S) $('app').innerHTML = '<div class="empty">Could not load matches. Check your connection.</div>'; }
}
refresh();
setInterval(refresh, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
