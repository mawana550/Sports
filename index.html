<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live Sports</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05070c">
<link rel="manifest" href="manifest.json">
<style>
  :root { --bg:#05070c; --panel:#121827; --line:#222b3f; --text:#f2f5fb; --muted:#8b95ab; --live:#e5484d; --accent:#2fb67c; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: env(safe-area-inset-bottom, 0px); }

  /* ---------- Player ---------- */
  .player { position:relative; width:100%; aspect-ratio:16/9; background:#000;
    padding-top: env(safe-area-inset-top, 0px); }
  .player video, .player iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:#000; }
  .status { position:absolute; inset:0; display:grid; place-items:center; color:#cfd5e3; font-size:1.1rem; pointer-events:none; }
  .fs-btn { position:absolute; right:10px; bottom:10px; z-index:5; border:0; border-radius:8px;
    padding:8px 12px; background:rgba(0,0,0,.6); color:#fff; font-size:.9rem; }

  /* ---------- Match header ---------- */
  .info { padding:16px 14px 8px; }
  .teams { display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:1.35rem; font-weight:700; }
  .teams .vs { color:var(--muted); font-size:.9rem; font-weight:600; }
  .meta { margin-top:4px; color:var(--muted); font-size:.95rem; }
  .sound { margin:12px 0 4px; }
  .sound select { background:var(--panel); color:var(--text); border:1px solid var(--line);
    border-radius:10px; padding:10px 12px; font-size:1rem; }

  /* ---------- Match lists ---------- */
  .lists { padding:8px 14px 24px; }
  .lists h3 { margin:20px 0 8px; font-size:1.05rem; }
  .card { display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:12px 14px; margin-bottom:8px; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; color:inherit; text-decoration:none; }
  .card.current { border-color:var(--accent); }
  .card b { display:block; font-size:1rem; }
  .card small { color:var(--muted); }
  .badge { font-size:.8rem; font-weight:700; padding:3px 8px; border-radius:6px; background:var(--live); color:#fff; }
  .badge.soon { background:var(--line); color:var(--muted); }
  .empty { color:var(--muted); padding:6px 2px; }

  /* ---------- Landscape / fullscreen: player fills the screen ---------- */
  .is-fullscreen .info, .is-fullscreen .lists { display:none; }
  .is-fullscreen body, body.is-fullscreen { overflow:hidden; }
  .is-fullscreen .player { position:fixed; inset:0; width:100vw; height:100dvh; aspect-ratio:auto;
    padding:0; z-index:9999; }

  @media (orientation: landscape) and (max-height: 500px) {
    .info, .lists { display:none; }
    body { overflow:hidden; }
    .player { position:fixed; inset:0; width:100vw; height:100dvh; aspect-ratio:auto; padding:0; z-index:9999; }
  }
</style>
</head>
<body>

<div class="player" id="player">
  <video id="video" playsinline webkit-playsinline controls autoplay></video>
  <div class="status" id="status">Connecting…</div>
  <button class="fs-btn" id="fsBtn" type="button">Full screen</button>
</div>

<div class="info">
  <div class="teams">
    <span id="home">Rock Rangers</span><span class="vs">vs</span><span id="away">Valley Stars</span>
  </div>
  <div class="meta" id="meta">Village League · Tomorrow 23:06</div>
  <div class="sound">
    <select id="sound" aria-label="Sound">
      <option>Original sound</option>
    </select>
  </div>
</div>

<div class="lists">
  <h3>Live now</h3>
  <div id="live"></div>
  <h3>Upcoming</h3>
  <div id="upcoming"></div>
</div>

<script>
/* ======== 1. YOUR DATA — replace with your real API / list ======== */
const STREAM_URL = "";               // put your .m3u8 or .mp4 URL here
const CURRENT_ID = 1;
const matches = [
  { id:1, home:"Rock Rangers", away:"Valley Stars",  league:"Village League", time:"Tomorrow 23:06", live:false },
  { id:2, home:"Hill United",  away:"River Town",    league:"Village League", time:"Live",           live:true  },
  { id:3, home:"Oak City",     away:"Pine FC",       league:"County Cup",     time:"Today 21:30",    live:true  },
  { id:4, home:"Lake Rovers",  away:"Stone Athletic",league:"County Cup",     time:"Sat 18:00",      live:false },
  { id:5, home:"North End",    away:"South Vale",    league:"Village League", time:"Sun 15:00",      live:false }
];
// To load from your server instead:
// fetch('/api/matches').then(r => r.json()).then(d => { matches.splice(0, matches.length, ...d); renderLists(); });

/* ======== 2. Match lists (fills the dark space) ======== */
const $ = id => document.getElementById(id);
function card(m) {
  const badge = m.live ? '<span class="badge">LIVE</span>' : '<span class="badge soon">Soon</span>';
  return `<a class="card ${m.id === CURRENT_ID ? 'current' : ''}" href="?match=${m.id}">
    <span><b>${m.home} vs ${m.away}</b><small>${m.league} · ${m.time}</small></span>${badge}</a>`;
}
function renderLists() {
  const live = matches.filter(m => m.live);
  const soon = matches.filter(m => !m.live);
  $('live').innerHTML = live.length ? live.map(card).join('') : '<div class="empty">No live matches right now.</div>';
  $('upcoming').innerHTML = soon.length ? soon.map(card).join('') : '<div class="empty">No upcoming matches.</div>';
}
renderLists();

/* ======== 3. Video ======== */
const video = $('video');
if (STREAM_URL) {
  if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = STREAM_URL;                      // iPhone plays HLS natively
  } else {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js';
    s.onload = () => { const h = new Hls(); h.loadSource(STREAM_URL); h.attachMedia(video); };
    document.head.appendChild(s);
  }
  video.addEventListener('playing', () => $('status').style.display = 'none');
}

/* ======== 4. Full screen ======== */
const player = $('player');
let fake = false;

function enterFullscreen() {
  // 1) Real fullscreen where the browser allows it (Android, desktop)
  if (player.requestFullscreen) { player.requestFullscreen().catch(fakeFs); return; }
  // 2) iPhone: native video fullscreen (no browser bars)
  if (video.webkitEnterFullscreen) { try { video.webkitEnterFullscreen(); return; } catch (e) {} }
  // 3) Fallback: fill the whole viewport
  fakeFs();
}
function fakeFs() { fake = true; document.documentElement.classList.add('is-fullscreen'); document.body.classList.add('is-fullscreen'); }
function exitFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  fake = false;
  document.documentElement.classList.remove('is-fullscreen');
  document.body.classList.remove('is-fullscreen');
}
$('fsBtn').addEventListener('click', () => (document.fullscreenElement || fake) ? exitFullscreen() : enterFullscreen());
video.addEventListener('dblclick', enterFullscreen);

// Rotate the phone sideways -> go fullscreen automatically (where allowed)
const landscape = window.matchMedia('(orientation: landscape)');
landscape.addEventListener('change', e => {
  if (e.matches && !document.fullscreenElement && player.requestFullscreen) player.requestFullscreen().catch(() => {});
  if (!e.matches) exitFullscreen();
});
</script>
</body>
</html>
