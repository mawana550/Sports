<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin – Village League TV</title>
<style>
:root{--bg:#0b0e14;--card:#151922;--green:#00ff87;--cyan:#02efe6;--red:#ff3366;--text:#fff;--muted:#8e9aaf;--border:#232a3b}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Verdana,sans-serif}
body{background:var(--bg);color:var(--text);padding:14px}
.wrap{max-width:820px;margin:0 auto}
h1{font-size:1.2rem;color:var(--green)} h2{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--cyan);margin:16px 0 6px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px}
label{display:block;font-size:.72rem;color:var(--muted);margin:8px 0 3px}
input,select{width:100%;background:#0d1017;color:#fff;border:1px solid var(--border);border-radius:8px;padding:9px 10px;font-size:.9rem}
button{background:#232a3b;color:#fff;border:0;border-radius:8px;padding:8px 11px;font-size:.8rem;cursor:pointer}
button.pri{background:var(--green);color:#04130b;font-weight:700} button.red{background:var(--red)} button.live{background:#ff336633;color:#ff7a96}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px} .tabs button{white-space:nowrap} .tabs button.on{background:var(--cyan);color:#04130b;font-weight:700}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px} .bar input{flex:1;min-width:120px}
.chip.on{background:var(--green);color:#04130b;font-weight:700}
.mrow{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.mt{display:flex;align-items:center;gap:6px;flex-wrap:wrap} .mt i{color:var(--muted);font-size:.75rem}
.bd{width:22px;height:22px;object-fit:contain;border-radius:50%;background:#0d1017;display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.meta{font-size:.74rem;color:var(--muted);margin-top:3px}
.mact{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:.65rem;font-weight:800;padding:2px 7px;border-radius:6px;background:#232a3b} .tag.live{background:var(--red)}
details.more{position:relative;margin-left:auto} details.more summary{list-style:none;background:#232a3b;border-radius:8px;padding:8px 12px;cursor:pointer}
.menu{position:absolute;right:0;top:100%;z-index:5;background:#1b2130;border:1px solid var(--border);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:130px;margin-top:4px}
details.fin summary{cursor:pointer;color:var(--muted);font-size:.8rem;margin:10px 0;list-style:none}
dialog{background:var(--card);color:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;width:min(560px,94vw);max-height:90vh;margin:auto}
dialog::backdrop{background:#000b}
.pick{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:10px;background:#0d1017;border:1px solid var(--border)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px} .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.item{display:flex;align-items:center;gap:8px;padding:9px;border-radius:8px;cursor:pointer} .item:hover{background:#232a3b}
#plist{max-height:42vh;overflow:auto;margin-top:8px}
.srow{display:grid;grid-template-columns:100px 1fr;gap:6px;margin-top:6px} .srow input:last-child{grid-column:1/-1}
.trow{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:5px} .trow b{flex:1}
.chk{display:flex;align-items:center;gap:8px;margin-top:10px} .chk input{width:auto}
#msg{position:fixed;inset:auto auto 16px 50%;transform:translateX(-50%);margin:0;border:0;background:var(--green);color:#04130b;padding:9px 16px;border-radius:10px;font-weight:700} #msg.err{background:var(--red);color:#fff}
a{color:var(--cyan)} @media(max-width:520px){.g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div id="login" class="box" style="max-width:340px;margin:60px auto"><h1>Admin login</h1>
<label>Password</label><input type="password" id="pw" autofocus><div class="acts"><button class="pri" id="loginBtn">Log in</button></div></div>

<div id="app" hidden>
<div class="top"><h1>⚽ Dashboard</h1><span><a href="/" target="_blank">viewer ↗</a> &nbsp;<button id="logoutBtn">Log out</button></span></div>
<div class="tabs"><button data-tab="matches" class="on">Matches</button><button data-tab="teams">Teams</button><button data-tab="coms">Commentary</button><button data-tab="set">Settings</button></div>

<section id="t-matches">
<div class="bar"><button class="pri" id="newMatch">＋ New match</button><input id="q" placeholder="Search matches…"></div>
<div class="bar"><button class="chip on" data-f="all">All</button><button class="chip" data-f="live">Live</button><button class="chip" data-f="today">Today</button></div>
<div id="matches"></div>
</section>

<section id="t-teams" hidden>
<div class="bar"><button class="pri" id="newTeam">＋ Add team</button><input id="tq" placeholder="Search teams…"></div>
<div id="teams"></div>
</section>

<section id="t-coms" hidden><div class="box"><div id="coms"></div>
<div class="acts"><button id="addCom">＋ Add commentary</button><button class="pri" id="saveCom">Save</button></div>
<div class="meta">Use the station's online stream URL (.mp3 / .aac / Icecast). An FM frequency cannot be read by a website.</div></div></section>

<section id="t-set" hidden><div class="box"><label>League name</label><div class="bar"><input id="lname"><button class="pri" id="saveName">Save</button></div></div></section>
</div>
</div>

<dialog id="matchDlg">
<h1 id="mTitle">New match</h1>
<div class="g2"><div><label>Home team</label><button class="pick" id="pickHome"></button></div><div><label>Away team</label><button class="pick" id="pickAway"></button></div></div>
<div class="g2"><div><label>Competition</label><input id="league"></div><div><label>Kick-off</label><input type="datetime-local" id="kick"></div></div>
<div class="g2"><div><label>Status</label><select id="status"><option value="upcoming">Upcoming</option><option value="live">Live</option><option value="finished">Finished</option></select></div></div>
<details id="srcDet" style="margin-top:10px"><summary style="cursor:pointer;color:var(--cyan);font-size:.85rem">Stream links (optional)</summary><div id="srcs"></div></details>
<div class="chk"><input type="checkbox" id="pinned"><label for="pinned" style="margin:0;color:#fff;font-size:.9rem">📌 Pin to the top</label></div>
<div class="acts"><button class="pri" id="saveBtn">Save</button><button id="anotherBtn">Save &amp; add another</button><button id="cancelM">Cancel</button></div>
</dialog>

<dialog id="pickDlg">
<h1>Choose team</h1><input id="pq" placeholder="Type to search or add a team…" style="margin-top:8px">
<div id="plist"></div>
<div id="padd" class="box" style="display:none;margin-top:8px"><b>＋ Add new team “<span id="pnew"></span>”</b>
<label>Badge link (optional)</label><input id="plogo" placeholder="https://…/badge.png"><div class="acts"><button class="pri" id="padBtn">Add &amp; select</button></div></div>
<div class="acts"><button id="cancelP">Close</button></div>
</dialog>

<dialog id="teamDlg">
<h1 id="tTitle">Add team</h1><label>Team name</label><input id="tName"><label>Badge link (optional)</label><input id="tLogo" placeholder="https://…/badge.png">
<div class="mt" style="margin-top:10px" id="tPrev"></div>
<div class="acts"><button class="pri" id="tSave">Save</button><button id="cancelT">Cancel</button></div>
</dialog>

<dialog id="linkDlg">
<h1>Stream link</h1><div class="meta" id="linkInfo"></div>
<input id="linkIn" placeholder="Paste NEW stream link (viewers switch automatically)" style="margin-top:8px">
<div class="acts"><button class="pri" id="linkSave">Update link</button><button id="cancelL">Cancel</button></div>
</dialog>
<div id="msg" popover="manual"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token = localStorage.getItem('vltv_token') || '', S = { matches:[], teams:[], commentary:[], leagueName:'' }, F = null, pickSide = '', filter = 'all', linkId = '', teamId = '', lastLeague = 'Village League';
const byName = (a,b) => a.name.localeCompare(b.name);
const badge = u => u ? '<img class="bd" src="' + esc(u) + '" onerror="this.style.visibility=\'hidden\'">' : '<span class="bd">⚽</span>';

function toast(t, err){ const m = $('msg'); m.textContent = t; m.className = err ? 'err' : ''; try { m.showPopover(); } catch {} clearTimeout(toast.t); toast.t = setTimeout(() => { try { m.hidePopover(); } catch {} }, 2500); }
async function api(method, url, body){
  const r = await fetch(url, { method, headers: { 'Content-Type':'application/json', 'x-token': token }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && url !== '/api/login') { logout(); throw new Error('Please log in again'); }
  if (!r.ok) throw new Error(j.error || 'Error');
  return j;
}
function logout(){ token = ''; localStorage.removeItem('vltv_token'); $('app').hidden = true; $('login').style.display = 'block'; }
$('logoutBtn').onclick = logout;
$('loginBtn').onclick = async () => { try { const j = await api('POST', '/api/login', { password: $('pw').value }); token = j.token; localStorage.setItem('vltv_token', token); start(); } catch (e) { toast(e.message, true); } };
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });
async function load(){ S = await (await fetch('/api/state', {cache:'no-store'})).json(); S.teams = S.teams || []; renderAll(); }
async function start(){ $('login').style.display = 'none'; $('app').hidden = false; await load(); }
document.addEventListener('click', e => document.querySelectorAll('details.more[open]').forEach(d => { if (!d.contains(e.target)) d.open = false; }));
document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-tab]').forEach(x => x.classList.toggle('on', x === b));
  ['matches','teams','coms','set'].forEach(t => $('t-' + t).hidden = t !== b.dataset.tab);
});
document.querySelectorAll('.chip').forEach(b => b.onclick = () => { filter = b.dataset.f; document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b)); renderMatches(); });
$('q').oninput = renderMatches; $('tq').oninput = renderTeams;

function expiryNote(url){
  try { const t = new URL(url).searchParams.get('txTime'); if (!t || !/^[0-9a-f]{8}$/i.test(t)) return '';
    const left = parseInt(t, 16) * 1000 - Date.now();
    if (left <= 0) return ' · <span style="color:var(--red);font-weight:700">⚠ link EXPIRED</span>';
    return ' · ⏳ expires in ' + Math.floor(left / 36e5) + 'h ' + Math.floor(left % 36e5 / 6e4) + 'm';
  } catch { return ''; }
}
function toLocalInput(iso){ const d = new Date(iso); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,16); }
function dayLabel(iso){ const d = new Date(iso), n = new Date(); if (d.toDateString() === n.toDateString()) return 'Today'; if (d.toDateString() === new Date(n.getTime() + 864e5).toDateString()) return 'Tomorrow'; return d.toLocaleDateString([], {weekday:'long', day:'numeric', month:'short'}); }

/* ---------- matches ---------- */
const row = m => { const cur = m.sources[0] ? m.sources[0].url : '';
  return '<div class="mrow" data-id="' + m.id + '"><div class="mt">' + badge(m.homeLogo) + '<b>' + esc(m.home) + '</b><i>vs</i><b>' + esc(m.away) + '</b>' + badge(m.awayLogo) + '</div>' +
  '<div class="meta">' + (m.pinned ? '📌 ' : '') + new Date(m.kickoff).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) + ' · ' + esc(m.league) + ' · <span class="tag ' + (m.status === 'live' ? 'live' : '') + '">' + m.status.toUpperCase() + '</span>' + (cur ? '' : ' · <span style="color:#ffc857">no link</span>') + expiryNote(cur) + '</div>' +
  '<div class="mact">' + (m.status === 'upcoming' ? '<button class="live" data-a="live">● Go live</button>' : '') + (m.status === 'live' ? '<button data-a="finish">Finish</button>' : '') + '<button data-a="link">🔗 Link</button>' +
  '<details class="more"><summary>⋯</summary><div class="menu"><button data-a="edit">Edit</button><button data-a="pin">' + (m.pinned ? 'Unpin' : 'Pin') + '</button><button data-a="dup">Duplicate</button><button class="red" data-a="del">Delete</button></div></details></div></div>';
};
function renderMatches(){
  const q = $('q').value.trim().toLowerCase(), today = new Date().toDateString();
  let ms = S.matches.filter(m => (m.home + ' ' + m.away + ' ' + m.league).toLowerCase().includes(q));
  const fin = ms.filter(m => m.status === 'finished').sort((a,b) => new Date(b.kickoff) - new Date(a.kickoff));
  ms = ms.filter(m => m.status !== 'finished');
  if (filter === 'live') ms = ms.filter(m => m.status === 'live');
  if (filter === 'today') ms = ms.filter(m => new Date(m.kickoff).toDateString() === today);
  ms.sort((a,b) => (b.status === 'live') - (a.status === 'live') || new Date(a.kickoff) - new Date(b.kickoff));
  let h = '', last = '';
  for (const m of ms) { const g = m.status === 'live' ? '● Live now' : dayLabel(m.kickoff); if (g !== last) { h += '<h2>' + g + '</h2>'; last = g; } h += row(m); }
  if (!ms.length) h = '<div class="box meta">No matches here.</div>';
  if (fin.length && filter === 'all') h += '<details class="fin"><summary>▸ Finished (' + fin.length + ')</summary>' + fin.map(row).join('') + '</details>';
  $('matches').innerHTML = h;
}
const put = (m, patch) => api('PUT', '/api/admin/matches/' + m.id, { ...m, ...patch }).then(() => { toast('Saved ✔'); load(); }).catch(e => toast(e.message, true));
$('matches').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const m = S.matches.find(x => x.id === b.closest('[data-id]').dataset.id); if (!m) return;
  switch (b.dataset.a) {
    case 'live': return put(m, { status: 'live' });
    case 'finish': return put(m, { status: 'finished' });
    case 'pin': return put(m, { pinned: !m.pinned });
    case 'edit': return openMatch(m);
    case 'dup': return openMatch({ ...m, id: '' });
    case 'link': { linkId = m.id; const cur = m.sources[0] ? m.sources[0].url : ''; $('linkIn').value = cur; $('linkInfo').innerHTML = esc(m.home) + ' vs ' + esc(m.away) + expiryNote(cur); return $('linkDlg').showModal(); }
    case 'del': if (confirm('Delete this match?')) api('DELETE', '/api/admin/matches/' + m.id).then(() => { toast('Deleted'); load(); }).catch(err => toast(err.message, true));
  }
});
$('linkSave').onclick = () => {
  const m = S.matches.find(x => x.id === linkId), url = $('linkIn').value.trim(); if (!m) return;
  if (!/^https?:\/\//i.test(url)) return toast('Enter a full link starting with http', true);
  const type = /\.m3u8(\?|$)/i.test(url) ? 'hls' : (m.sources[0] ? m.sources[0].type : 'hls');
  put(m, { sources: [{ type, url, label: (m.sources[0] && m.sources[0].label) || 'Main' }, ...m.sources.slice(1)], status: m.status === 'upcoming' ? 'live' : m.status });
  $('linkDlg').close();
};
$('cancelL').onclick = () => $('linkDlg').close();

/* ---------- match form ---------- */
function buildSrc(list){
  let h = ''; for (let i = 0; i < 3; i++) { const s = list[i] || {};
    h += '<div class="srow"><select class="stype"><option value="hls"' + (s.type !== 'embed' ? ' selected' : '') + '>Video (.m3u8)</option><option value="embed"' + (s.type === 'embed' ? ' selected' : '') + '>Embed page</option></select><input class="surl" placeholder="https://…/stream.m3u8" value="' + esc(s.url || '') + '"><input class="slabel" placeholder="Label (optional)" value="' + esc(s.label || '') + '"></div>'; }
  $('srcs').innerHTML = h;
}
function showTeams(){ for (const [id, k] of [['pickHome','home'],['pickAway','away']]) $(id).innerHTML = F[k] ? badge(F[k].logo) + '<span>' + esc(F[k].name) + '</span>' : '<span style="color:var(--muted)">Choose team…</span>'; }
function openMatch(m){
  F = { id: m && m.id || '', home: m ? { id: m.homeId || '', name: m.home, logo: m.homeLogo } : null, away: m ? { id: m.awayId || '', name: m.away, logo: m.awayLogo } : null };
  $('league').value = m ? m.league : lastLeague; $('kick').value = toLocalInput(m ? m.kickoff : new Date(Date.now() + 36e5).toISOString());
  $('status').value = m ? m.status : 'upcoming'; $('pinned').checked = m ? m.pinned : true;
  buildSrc(m ? m.sources : []); $('srcDet').open = !!(m && m.sources.length);
  $('anotherBtn').style.display = F.id ? 'none' : ''; $('mTitle').textContent = F.id ? 'Edit match' : 'New match';
  showTeams(); $('matchDlg').showModal();
}
$('newMatch').onclick = () => openMatch(); $('cancelM').onclick = () => $('matchDlg').close();
async function saveMatch(another){
  if (!F.home || !F.away) return toast('Choose both teams', true);
  if (F.home.name === F.away.name) return toast('Pick two different teams', true);
  const types = [...document.querySelectorAll('.stype')], urls = [...document.querySelectorAll('.surl')], labels = [...document.querySelectorAll('.slabel')];
  const d = { home: F.home.name, homeId: F.home.id, homeLogo: F.home.logo, away: F.away.name, awayId: F.away.id, awayLogo: F.away.logo, league: $('league').value,
    kickoff: $('kick').value ? new Date($('kick').value).toISOString() : new Date().toISOString(), status: $('status').value, pinned: $('pinned').checked,
    sources: urls.map((u,i) => ({ type: types[i].value, url: u.value.trim(), label: labels[i].value })).filter(s => s.url) };
  try {
    F.id ? await api('PUT', '/api/admin/matches/' + F.id, d) : await api('POST', '/api/admin/matches', d);
    lastLeague = d.league || lastLeague; toast('Saved ✔'); await load();
    if (another) { F.home = F.away = null; const k = new Date($('kick').value); k.setHours(k.getHours() + 2); $('kick').value = toLocalInput(k.toISOString()); buildSrc([]); showTeams(); }
    else $('matchDlg').close();
  } catch (e) { toast(e.message, true); }
}
$('saveBtn').onclick = () => saveMatch(false); $('anotherBtn').onclick = () => saveMatch(true);

/* ---------- team picker ---------- */
function openPick(side){ pickSide = side; $('pq').value = ''; renderPick(); $('pickDlg').showModal(); }
function renderPick(){
  const raw = $('pq').value.trim(), q = raw.toLowerCase();
  const list = S.teams.filter(t => t.name.toLowerCase().includes(q)).sort(byName);
  $('plist').innerHTML = list.map(t => '<div class="item" data-id="' + t.id + '">' + badge(t.logo) + '<span>' + esc(t.name) + '</span></div>').join('') || '<div class="meta">No team found – add it below.</div>';
  $('padd').style.display = raw && !S.teams.some(t => t.name.toLowerCase() === q) ? 'block' : 'none'; $('pnew').textContent = raw;
}
function choose(t){ F[pickSide] = { id: t.id, name: t.name, logo: t.logo || '' }; showTeams(); $('pickDlg').close(); }
$('pickHome').onclick = () => openPick('home'); $('pickAway').onclick = () => openPick('away');
$('pq').oninput = renderPick; $('cancelP').onclick = () => $('pickDlg').close();
$('plist').onclick = e => { const i = e.target.closest('.item'); if (i) choose(S.teams.find(t => t.id === i.dataset.id)); };
$('padBtn').onclick = async () => {
  try { const t = await api('POST', '/api/admin/teams', { name: $('pq').value, logo: $('plogo').value.trim() }); $('plogo').value = ''; await load(); choose(t); }
  catch (e) { toast(e.message, true); }
};

/* ---------- teams tab ---------- */
function renderTeams(){
  const q = $('tq').value.trim().toLowerCase(), list = S.teams.filter(t => t.name.toLowerCase().includes(q)).sort(byName);
  $('teams').innerHTML = list.length ? list.map(t => '<div class="trow" data-id="' + t.id + '">' + badge(t.logo) + '<b>' + esc(t.name) + '</b><button data-a="edit">Edit</button><button class="red" data-a="del">✕</button></div>').join('') : '<div class="box meta">No teams yet – add one, or pick “＋ Add new team” when creating a match.</div>';
}
function openTeam(t){ teamId = t ? t.id : ''; $('tTitle').textContent = t ? 'Edit team' : 'Add team'; $('tName').value = t ? t.name : ''; $('tLogo').value = t ? t.logo : ''; prevTeam(); $('teamDlg').showModal(); }
function prevTeam(){ $('tPrev').innerHTML = badge($('tLogo').value.trim()) + '<b>' + esc($('tName').value || 'Team name') + '</b>'; }
$('tName').oninput = $('tLogo').oninput = prevTeam; $('newTeam').onclick = () => openTeam(); $('cancelT').onclick = () => $('teamDlg').close();
$('tSave').onclick = async () => {
  const d = { name: $('tName').value, logo: $('tLogo').value.trim() };
  try { teamId ? await api('PUT', '/api/admin/teams/' + teamId, d) : await api('POST', '/api/admin/teams', d); toast('Saved ✔'); $('teamDlg').close(); load(); } catch (e) { toast(e.message, true); }
};
$('teams').onclick = e => {
  const b = e.target.closest('button'); if (!b) return; const t = S.teams.find(x => x.id === b.closest('[data-id]').dataset.id); if (!t) return;
  if (b.dataset.a === 'edit') openTeam(t);
  else if (confirm('Delete ' + t.name + '? Matches already using it keep the name.')) api('DELETE', '/api/admin/teams/' + t.id).then(() => { toast('Deleted'); load(); }).catch(err => toast(err.message, true));
};

/* ---------- commentary & settings ---------- */
function comRow(c){ return '<div class="srow com" data-id="' + esc(c.id || '') + '" style="grid-template-columns:1fr 2fr"><input class="clabel" placeholder="e.g. English commentary" value="' + esc(c.label || '') + '"><input class="curl" placeholder="https://…/stream.mp3" value="' + esc(c.url || '') + '"></div>'; }
$('addCom').onclick = () => $('coms').insertAdjacentHTML('beforeend', comRow({}));
$('saveCom').onclick = async () => {
  const list = [...document.querySelectorAll('.com')].map(r => ({ id: r.dataset.id, label: r.querySelector('.clabel').value, url: r.querySelector('.curl').value.trim() }));
  try { await api('PUT', '/api/admin/commentary', { commentary: list }); toast('Commentary saved ✔'); load(); } catch (e) { toast(e.message, true); }
};
$('saveName').onclick = async () => { try { await api('PUT', '/api/admin/settings', { leagueName: $('lname').value }); toast('Saved ✔'); load(); } catch (e) { toast(e.message, true); } };
